
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09172b">
<title>JARVIS V9</title>
<style>
:root{color-scheme:dark;--cyan:#65dfff;--glass:rgba(9,24,43,.72);--line:#ffffff30}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#09172b;color:#fff;font-family:Arial,Helvetica,sans-serif}
.scene{min-height:100vh;position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(180deg,#152b51 0%,#d57c83 39%,#f7b58b 52%,#182c49 100%)}
.sun{position:absolute;z-index:-2;width:180px;height:180px;border-radius:50%;background:#ffb887;filter:blur(2px);left:50%;top:30%;transform:translateX(-50%);box-shadow:0 0 100px 35px #ffad8b66}
.mountain{position:absolute;inset:0;z-index:-1;width:100%;height:100%;pointer-events:none}
header{padding:22px 24px;display:flex;justify-content:space-between;align-items:center;gap:15px}
.brand{font-size:22px;font-weight:700;letter-spacing:3px}
.brand small{display:block;font-size:10px;font-weight:400;letter-spacing:1px;margin-top:5px;color:#d6e6ff}
.datetime{text-align:right;font-size:19px}
.datetime small{display:block;font-size:11px;color:#d6e6ff;margin-top:5px}
main{width:min(850px,100%);margin:auto;padding:18px 18px 35px}
.intro{text-align:center;margin:15px 0 28px}
h1{font-size:clamp(25px,5vw,38px);margin:0 0 10px;text-shadow:0 2px 18px #0007}
.intro p{font-size:14px;color:#e5edff}
.command{display:flex;align-items:center;gap:9px;border:1px solid #7bdfff;border-radius:40px;background:rgba(3,16,35,.72);padding:7px 10px 7px 20px;max-width:530px;margin:25px auto 30px}
.command input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:white;font-size:16px;padding:10px 0}
.command input::placeholder{color:#d5e3f5}
button{font:inherit;cursor:pointer;color:white}
.round{border:0;border-radius:50%;width:42px;height:42px;background:#138bdb;font-size:19px;flex-shrink:0}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.card{min-height:100px;border:1px solid var(--line);border-radius:16px;background:var(--glass);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:background .2s,border-color .2s}
.card:hover,.card:focus-visible{border-color:var(--cyan);background:#174b6a99}
.card .icon{font-size:27px;color:#c9edff}
.card span:last-child{font-size:12px}
.panel{margin-top:22px;border:1px solid var(--line);border-radius:15px;background:rgba(3,15,32,.72);padding:16px 18px;backdrop-filter:blur(12px)}
.panel-title{font-size:10px;letter-spacing:2px;color:#84dfff;margin-bottom:10px}
#reply{font-size:14px;line-height:1.65;overflow-wrap:anywhere;white-space:pre-wrap}
#reply:before{content:"> ";color:var(--cyan)}
.action{display:inline-block;text-decoration:none;border:1px solid #65dfff88;background:#0a3554;border-radius:10px;padding:9px 13px;margin:10px 6px 0 0}
.action:hover{background:#145477}
.weather-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.metric{padding:12px;border:1px solid #ffffff20;border-radius:10px;background:#ffffff08}
.metric small{display:block;color:#c5d9ee;margin-bottom:5px}
.metric strong{font-size:19px;overflow-wrap:anywhere}
.player{width:100%;height:152px;border:0;border-radius:12px;margin-top:12px}
.muted{color:#d2e0ef;font-size:12px;line-height:1.5}
footer{text-align:center;font-size:10px;letter-spacing:2px;color:#c5d9eeaa;padding:25px 5px}
@media(max-width:540px){
 header{padding:18px 15px}.brand{font-size:19px}.datetime{font-size:16px}
 main{padding:15px 13px 28px}
 .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
 .card{min-height:90px}.card .icon{font-size:24px}
 .command{padding-left:14px}.player{height:152px}
}
</style>
</head>
<body>
<div class="scene">
<div class="sun"></div>
<svg class="mountain" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
 <path fill="#435575" d="M0 440L110 350 175 390 300 245 390 350 500 190 610 350 735 225 850 360 965 270 1080 360 1200 285V900H0Z"/>
 <path fill="#253a5a" d="M0 530L130 420 245 490 360 390 490 520 625 395 755 510 890 410 1020 505 1120 430 1200 480V900H0Z"/>
 <path fill="#050b16" d="M0 690L180 570 340 680 520 565 700 690 900 575 1060 680 1200 610V900H0Z"/>
</svg>
<header>
 <div class="brand">JARVIS<small>Your personal assistant</small></div>
 <div class="datetime"><span id="clock">--:--</span><small id="date">Loading date...</small></div>
</header>
<main>
 <div class="intro"><h1 id="greeting">Welcome back.</h1><p>What would you like to do today?</p></div>
 <form class="command" id="form">
  <input id="input" placeholder="Try: weather, music, time..." autocomplete="off" aria-label="Type a command">
  <button class="round" type="button" id="mic" aria-label="Voice input">🎙</button>
  <button class="round" type="submit" aria-label="Send command">➤</button>
 </form>
 <div class="grid">
  <button class="card" data-cmd="help"><span class="icon">▤</span><span>Chat</span></button>
  <button class="card" data-cmd="notes"><span class="icon">▧</span><span>Notes</span></button>
  <button class="card" data-cmd="calculator"><span class="icon">▦</span><span>Calculator</span></button>
  <button class="card" data-cmd="weather"><span class="icon">☁</span><span>Weather</span></button>
  <button class="card" data-cmd="music"><span class="icon">♫</span><span>Music</span></button>
 </div>
 <section class="panel">
  <div class="panel-title">JARVIS RESPONSE</div>
  <div id="reply" aria-live="polite">JARVIS is ready. Type or speak a command.</div>
  <div id="details"></div>
 </section>
 <footer>JARVIS V9 · DREAM · PLAN · ACHIEVE</footer>
</main>
</div>
<script>
(function(){
'use strict';

const $=id=>document.getElementById(id);
const input=$('input'),reply=$('reply'),details=$('details');
const playlistId='1Zxvk6LxitGP1gUmeu40KK';

function clearDetails(){details.replaceChildren()}
function show(text,voice){
 reply.textContent=text;
 clearDetails();
 if(voice!==false)speak(text);
}
function speak(text){
 if(!('speechSynthesis' in window))return;
 window.speechSynthesis.cancel();
 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang='en-IN';
 utterance.rate=1;
 window.speechSynthesis.speak(utterance);
}
function updateTime(){
 const now=new Date();
 $('clock').textContent=now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
 $('date').textContent=now.toLocaleDateString([],{weekday:'short',day:'numeric',month:'short',year:'numeric'});
 const hour=now.getHours();
 $('greeting').textContent=(hour<12?'Good morning':hour<17?'Good afternoon':'Good evening')+', Riyansh';
}
updateTime();
setInterval(updateTime,1000);

function metric(label,value){
 const box=document.createElement('div');
 box.className='metric';
 const caption=document.createElement('small');
 caption.textContent=label;
 const strong=document.createElement('strong');
 strong.textContent=value;
 box.append(caption,strong);
 return box;
}
function weatherLabel(code){
 if(code===0)return 'Clear sky';
 if([1,2,3].includes(code))return 'Partly cloudy';
 if([45,48].includes(code))return 'Fog';
 if([51,53,55,56,57].includes(code))return 'Drizzle';
 if([61,63,65,66,67,80,81,82].includes(code))return 'Rain';
 if([71,73,75,77,85,86].includes(code))return 'Snow';
 if([95,96,99].includes(code))return 'Thunderstorm';
 return 'Conditions unavailable';
}
async function getWeather(){
 show('Fetching live weather for Delhi…',false);
 const refresh=document.createElement('button');
 refresh.type='button';
 refresh.className='action';
 refresh.textContent='Refresh weather';
 refresh.addEventListener('click',getWeather);
 details.append(refresh);
 try{
  const url='https://api.open-meteo.com/v1/forecast?latitude=28.6139&longitude=77.2090&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&timezone=Asia%2FKolkata';
  const response=await fetch(url);
  if(!response.ok)throw new Error('Weather service returned HTTP '+response.status);
  const data=await response.json();
  if(!data.current)throw new Error('No current weather data received');
  const c=data.current;
  show('Live weather for Delhi, India.',false);
  const grid=document.createElement('div');
  grid.className='weather-grid';
  grid.append(
   metric('Condition',weatherLabel(c.weather_code)),
   metric('Temperature',c.temperature_2m+' °C'),
   metric('Feels like',c.apparent_temperature+' °C'),
   metric('Humidity',c.relative_humidity_2m+'%'),
   metric('Wind',c.wind_speed_10m+' km/h'),
   metric('Precipitation',c.precipitation+' mm')
  );
  details.append(grid,refresh);
  const stamp=document.createElement('p');
  stamp.className='muted';
  stamp.textContent='Updated: '+new Date(c.time).toLocaleString('en-IN',{timeZone:'Asia/Kolkata'});
  details.append(stamp);
 }catch(error){
  show('Weather could not load. Check your internet connection and tap Refresh. '+error.message,false);
  details.append(refresh);
 }
}
function openMusic(){
 show('Your Spotify playlist is ready below. Press play in the player. Spotify may ask you to sign in.',false);
 const frame=document.createElement('iframe');
 frame.className='player';
 frame.title='Spotify playlist player';
 frame.src='https://open.spotify.com/embed/playlist/'+playlistId;
 frame.allow='autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture';
 frame.loading='lazy';
 details.append(frame);
 const link=document.createElement('a');
 link.className='action';
 link.href='https://open.spotify.com/playlist/'+playlistId;
 link.target='_blank';
 link.rel='noopener noreferrer';
 link.textContent='Open playlist in Spotify';
 details.append(link);
 const note=document.createElement('p');
 note.className='muted';
 note.textContent='Spotify playback is controlled by the embedded player. Autoplay is not guaranteed.';
 details.append(note);
}
function saveNote(){
 const note=prompt('Write your note:');
 if(note===null)return;
 try{
  const saved=JSON.parse(localStorage.getItem('jarvisNotes')||'[]');
  saved.push({text:note,created:new Date().toISOString()});
  localStorage.setItem('jarvisNotes',JSON.stringify(saved));
  show('Note saved on this browser/device.');
 }catch(error){
  show('Notes could not be saved. Browser storage may be disabled.');
 }
}
function calculator(){
 const expression=prompt('Enter a calculation, e.g. 12*(4+2):');
 if(expression===null)return;
 if(!/^[\d\s.+\-*/()%]+$/.test(expression)){
  show('Use only numbers and basic arithmetic operators.');
  return;
 }
 try{
  const tokens=expression.match(/\d+(?:\.\d+)?|[()+\-*/%]/g)||[];
  if(tokens.join('')!==expression.replace(/\s/g,''))throw Error('Invalid tokens');
  let i=0;
  function atom(){
   const token=tokens[i++];
   if(token==='+')return atom();
   if(token==='-')return -atom();
   if(token==='('){
    const value=sum();
    if(tokens[i++]!==')')throw Error('Missing bracket');
    return value;
   }
   if(token&&/^\d/.test(token))return Number(token);
   throw Error('Expected number');
  }
  function product(){
   let value=atom();
   while(['*','/','%'].includes(tokens[i])){
    const operator=tokens[i++],next=atom();
    if((operator==='/'||operator==='%')&&next===0)throw Error('Division by zero');
    value=operator==='*'?value*next:operator==='/'?value/next:value%next;
   }
   return value;
  }
  function sum(){
   let value=product();
   while(tokens[i]==='+'||tokens[i]==='-'){
    const operator=tokens[i++],next=product();
    value=operator==='+'?value+next:value-next;
   }
   return value;
  }
  const result=sum();
  if(i!==tokens.length||!Number.isFinite(result))throw Error('Invalid expression');
  show('Answer: '+result);
 }catch(error){
  show('Could not calculate that expression. Check the brackets and operators.');
 }
}
function run(raw){
 const q=raw.trim().toLowerCase();
 if(!q)return;
 if(q.includes('weather')){getWeather();return;}
 if(q.includes('music')||q.includes('spotify')||q.includes('playlist')||q.includes('song')){openMusic();return;}
 if(q.includes('time')){show('Current time: '+new Date().toLocaleTimeString());return;}
 if(q.includes('date')){show('Today is '+new Date().toLocaleDateString());return;}
 if(q.includes('note')){saveNote();return;}
 if(q.includes('calculator')||q==='calculate'){calculator();return;}
 if(q.includes('motivat')){show('Stay focused, Riyansh. Small consistent steps create big results.');return;}
 if(q.includes('joke')){show('Why did the computer go to the doctor? It had a virus!');return;}
 if(q==='hello'||q.includes('hello jarvis')){show('Hello Riyansh! JARVIS is online. How can I help?');return;}
 if(q==='help'||q.includes('commands')){show('Try: weather, music, time, date, notes, calculator, motivate me, or tell me a joke.');return;}
 show('I do not know that command yet. Type help to see available commands.');
}
$('form').addEventListener('submit',event=>{
 event.preventDefault();
 const command=input.value;
 input.value='';
 run(command);
});
document.querySelectorAll('[data-cmd]').forEach(button=>{
 button.addEventListener('click',()=>run(button.dataset.cmd));
});
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
let listening=null;
$('mic').addEventListener('click',()=>{
 if(!SpeechRecognition){show('Voice input is not supported by this browser. Please type your command.');return;}
 if(listening){listening.stop();return;}
 listening=new SpeechRecognition();
 listening.lang='en-IN';
 listening.interimResults=false;
 listening.onstart=()=>{$('mic').textContent='⏹';};
 listening.onresult=event=>{
  input.value=event.results[0][0].transcript;
  run(input.value);
 };
 listening.onerror=()=>show('Microphone unavailable. Check browser permission or type your command.');
 listening.onend=()=>{$('mic').textContent='🎙';listening=null;};
 try{listening.start();}catch(error){listening=null;show('Could not start voice input. Please type your command.');}
});
})();
</script>
</body>
                     </html>
