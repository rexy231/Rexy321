<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:#02070b;
  color:#00eaff;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.container{
  width:90%;
  max-width:600px;
}

h1{
  font-size:42px;
  letter-spacing:8px;
  margin-bottom:35px;
  text-shadow:0 0 20px #00eaff;
}

.core{
  width:180px;
  height:180px;
  margin:0 auto 35px;
  border-radius:50%;
  border:3px solid #00eaff;
  box-shadow:
    0 0 20px #00eaff,
    inset 0 0 25px #00eaff;
  display:flex;
  justify-content:center;
  align-items:center;
}

.core::after{
  content:"";
  width:35px;
  height:35px;
  background:#00eaff;
  border-radius:50%;
  box-shadow:0 0 30px #00eaff;
}

button{
  width:90%;
  max-width:350px;
  margin:8px;
  padding:14px;
  border:1px solid #00eaff;
  border-radius:10px;
  background:#03131a;
  color:#00eaff;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 0 10px #003d4a;
}

button:hover{
  background:#07303a;
  box-shadow:0 0 20px #00eaff;
}

#output{
  margin-top:25px;
  min-height:30px;
  color:#fff;
}

#calculator{
  display:none;
  margin:25px auto;
  padding:15px;
  border:1px solid #00eaff;
  border-radius:12px;
  max-width:350px;
}

#display{
  width:100%;
  padding:12px;
  background:#000;
  color:#00eaff;
  border:1px solid #00eaff;
  border-radius:8px;
  font-size:20px;
  margin-bottom:10px;
}

.calcbtn{
  width:60px;
  margin:3px;
  padding:12px 5px;
}

.history{
  margin-top:15px;
  text-align:left;
  max-height:120px;
  overflow:auto;
  color:#aaa;
  font-size:13px;
}

footer{
  margin-top:25px;
  color:#47747c;
  font-size:12px;
}
</style>
</head>

<body>

<div class="container">

<h1>JARVIS</h1>

<div class="core"></div>

<button onclick="testVoice()">🔊 TEST VOICE</button>

<button onclick="showTime()">🕐 TIME</button>

<button onclick="studyMode()">📚 STUDY MODE</button>

<button onclick="startVoice()">🎙️ VOICE COMMAND</button>

<button onclick="toggleCalculator()">🧮 CALCULATOR</button>

<div id="calculator">

<input id="display" type="text" placeholder="Enter calculation">

<div>
<button class="calcbtn" onclick="add('7')">7</button>
<button class="calcbtn" onclick="add('8')">8</button>
<button class="calcbtn" onclick="add('9')">9</button>
<button class="calcbtn" onclick="add('/')">÷</button>
</div>

<div>
<button class="calcbtn" onclick="add('4')">4</button>
<button class="calcbtn" onclick="add('5')">5</button>
<button class="calcbtn" onclick="add('6')">6</button>
<button class="calcbtn" onclick="add('*')">×</button>
</div>

div>
<button class="calcbtn" onclick="add('1')">1</button>
<button class="calcbtn" onclick="add('2')">2</button>
<button class="calcbtn" onclick="add('3')">3</button>
<button class="calcbtn" onclick="add('-')">−</button
<button class="calcbtn" onclick="add('-')">−</button>
