<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS V4</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
background:#050b14;
color:#00eaff;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
}

.jarvis{
width:94%;
max-width:650px;
text-align:center;
border:1px solid #00eaff;
border-radius:25px;
padding:25px 18px;
box-shadow:0 0 30px #006dff;
}

.core{
width:130px;
height:130px;
margin:18px auto;
border:5px solid #00eaff;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
box-shadow:0 0 35px #00eaff;
}

h1{
letter-spacing:8px;
margin-bottom:5px;
}

#status{
color:#8ff6ff;
margin-bottom:20px;
}

button{
background:transparent;
color:#00eaff;
border:1px solid #00eaff;
border-radius:12px;
padding:12px 15px;
margin:5px;
font-size:14px;
}

button:active{
background:#00eaff;
color:#001018;
}

#output{
margin-top:20px;
min-height:55px;
border:1px solid #174b63;
border-radius:12px;
padding:15px;
color:white;
}

#calculator{
display:none;
margin-top:20px;
padding:15px;
border:1px solid #174b63;
border-radius:15px;
}

#display{
width:100%;
padding:15px;
font-size:22px;
background:#02070d;
color:#00eaff;
border:1px solid #00eaff;
border-radius:10px;
text-align:right;
margin-bottom:10px;
}

.calc-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:7px;
}

.calc-grid button{
margin:0;
padding:14px 5px;
font-size:15px;
}

.history{
margin-top:15px;
text-align:left;
color:white;
max-height:130px;
overflow:auto;
font-size:13px;
}
</style>
</head>

<body>

<div class="jarvis">

<h1>J.A.R.V.I.S</h1>

<div id="status">SYSTEM ONLINE</div>

<div class="core">J</div>

<button onclick="speak('Hello. I am JARVIS.')">
🔊 TEST VOICE
</button>

<button onclick="tellTime()">
🕐 TIME
</button>

<button onclick="studyMode()">
📚 STUDY MODE
</button>

<button onclick="startListening()">
🎙️ VOICE COMMAND
</button>

<button onclick="toggleCalculator()">
🧮 CALCULATOR
</button>

<div id="output">
Awaiting command...
</div>


<!-- ADVANCED CALCULATOR -->

<div id="calculator">

<input id="display" readonly>

<div class="calc-grid">

<button onclick="clearCalc()">AC</button>
<button onclick="backspace()">⌫</button>
<button onclick="add('%')">%</button>
<button onclick="add('/')">÷</button>

<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button onclick="add('*')">×</button>

<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button onclick="add('-')">−</button>

<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button onclick="add('+')">+</button>

<button onclick="add('0')">0</button>
<button onclick="add('.')">.</button>
<button onclick="add('(')">(</button>
<button onclick="add(')')">)</button>

<button onclick="square()">x²</button>
<button onclick="power()">xʸ</button>
<button onclick="sqrtCalc()">√</button>
<button onclick="calculate()">=</button>

<button onclick="sinCalc()">sin</button>
<button onclick="cosCalc()">cos</button>
<button onclick="tanCalc()">tan</button>
<button onclick="reciprocal()">1/x</button>

<button onclick="logCalc()">log</button>
<button onclick="lnCalc()">ln</button>
<button onclick="add('Math.PI')">π</button>
<button onclick="add('Math.E')">e</button>

</div>

<div class="history">
<b>History</b>
<div id="history"></div>
</div>

</div>

</div>


<script>

/* =========================
   VOICE
========================= */

function speak(text){

document.getElementById("output").innerText=text;

speechSynthesis.cancel();

const voice=new SpeechSynthesisUtterance(text);

voice.rate=.95;
voice.pitch=.8;

speechSynthesis.speak(voice);
}


/* =========================
   TIME
========================= */

function tellTime(){

const time=new Date().toLocaleTimeString();

speak("The current time is "+time);
}


/* =========================
   STUDY MODE
========================= */

function studyMode(){

speak("Study mode activated. Let's begin.");
}


/* =========================
   CALCULATOR
========================= */

const display=document.getElementById("display");

function add(value){

display.value+=value;
}


function clearCalc(){

display.value="";
}


function backspace(){

display.value=display.value.slice(0,-1);
}


function safeExpression(expression){

return /^[0-9+\-*/().%\sA-Za-z]+$/.test(expression);
}


function calculate(){

const expression=display.value;

if(!expression) return;

if(!safeExpression(expression)){

speak("Invalid calculation.");
return;
}

try{

const result=Function(
'"use strict"; return ('+expression+')'
)();

if(!Number.isFinite(result)){

speak("Invalid result.");
return;
}

display.value=result;

addHistory(expression+" = "+result);

speak("The answer is "+result);

}catch{

speak("I could not calculate that.");
}

}


function square(){

if(!display.value) return;

try{

const x=Number(display.value);

const result=x*x;

display.value=result;

addHistory(x+"² = "+result);

}catch{

speak("Invalid number.");
}

}


function power(){

const x=prompt("Enter base:");

if(x===null)return;

const y=prompt("Enter power:");

if(y===null)return;

const result=Math.pow(Number(x),Number(y));

display.value=result;

addHistory(x+"^"+y+" = "+result);

speak("The answer is "+result);
}


function sqrtCalc(){

const x=Number(display.value);

if(x<0){

speak("Square root of a negative number is not supported.");

return;
}

const result=Math.sqrt(x);

display.value=result;

addHistory("√"+x+" = "+result);

speak("The answer is "+result);
}


function sinCalc(){

const x=Number(display.value);

const result=Math.sin(x*Math.PI/180);

display.value=result;

addHistory("sin("+x+"°) = "+result);
}


function cosCalc(){

const x=Number(display.value);

const result=Math.cos(x*Math.PI/180);

display.value=result;

addHistory("cos("+x+"°) = "+result);
}


function tanCalc(){

const x=Number(display.value);

const result=Math.tan(x*Math.PI/180);

display.value=result;

addHistory("tan("+x+"°) = "+result);
}


function logCalc(){

const x=Number(display.value);

if(x<=0){

speak("Log requires a positive number.");

return;
}

const result=Math.log10(x);

display.value=result;

addHistory("log("+x+") = "+result);
}


function lnCalc(){

const x=Number(display.value);

if(x<=0){

speak("Natural log requires a positive number.");

return;
}

const result=Math.log(x);

display.value=result;

addHistory("ln("+x+") = "+result);
}


function reciprocal(){

const x=Number(display.value);

if(x===0){

speak("Division by zero is not allowed.");

return;
}

const result=1/x;

display.value=result;

addHistory("1/"+x+" = "+result);
}


function addHistory(text){

const history=document.getElementById("history");

const item=document.createElement("div");

item.innerText=text;

history.prepend(item);
}


function toggleCalculator(){

const calculator=document.getElementById("calculator");

if(calculator.style.display==="block"){

calculator.style.display="none";

}else{

calculator.style.display="block";

}

}


/* =========================
   VOICE RECOGNITION
========================= */

const SpeechRecognition=
window.SpeechRecognition||
window.webkitSpeechRecognition;

let recognition;

if(SpeechRecognition){

recognition=new SpeechRecognition();

recognition.lang="en-IN";

recognition.continuous=false;

recognition.interimResults=false;


recognition.onstart=function(){

document.getElementById("status").innerText=
"LISTENING... 🎙️";

};


recognition.onresult=function(event){

const command=
event.results[0][0].transcript.toLowerCase();

document.getElementById("output").innerText=
"You: "+command;

processCommand(command);
};


recognition.onerror=function(){

document.getElementById("status").innerText=
"SYSTEM ONLINE";

speak("Sorry, I couldn't understand that.");
};


recognition.onend=function(){

document.getElementById("status").innerText=
"SYSTEM ONLINE";
};

}


function startListening(){

if(!recognition){

speak("Voice recognition is not supported.");

return;
}

recognition.start();
}


/* =========================
   COMMAND SYSTEM
========================= */

function processCommand(command){

if(
command.includes("hello")||
command.includes("hi jarvis")||
command.includes("hey jarvis")
){

speak("Hello. How can I help you?");

return;
}


if(
command.includes("time")||
command.includes("what time")
){

tellTime();

return;
}


if(
command.includes("study mode")||
command.includes("start studying")||
command.includes("activate study")
){

studyMode();

return;
}


if(
command.includes("calculator")||
command.includes("calculate")
){

toggleCalculator();

speak("Calculator activated.");

return;
}


if(
command.includes("stop")||
command.includes("cancel")
){

speechSynthesis.cancel();

document.getElementById("output").innerText=
"Command cancelled.";

return;
}


speak(
"I heard "+command+
". But I don't know that command yet."
);

}

</script>

</body>
</html>
