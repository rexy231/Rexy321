<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JARVIS</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:#02070d;
  color:#00eaff;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

.container{
  width:100%;
  max-width:700px;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:25px;
}

h1{
  font-size:48px;
  letter-spacing:12px;
  margin:0 0 45px;
  text-shadow:0 0 10px #00eaff,
              0 0 25px #00eaff,
              0 0 50px #007bff;
}

.core{
  width:190px;
  height:190px;
  border-radius:50%;
  border:3px solid #00eaff;
  box-shadow:0 0 15px #00eaff,
             0 0 40px #00eaff,
             inset 0 0 30px #006eff;
  display:flex;
  justify-content:center;
  align-items:center;
  animation:pulse 2s infinite;
  position:relative;
}

.core:before{
  content:"";
  width:80px;
  height:80px;
  border-radius:50%;
  border:2px solid #00eaff;
  box-shadow:0 0 25px #00eaff;
}

.core:after{
  content:"";
  position:absolute;
  width:18px;
  height:18px;
  border-radius:50%;
  background:white;
  box-shadow:0 0 10px #00eaff,
             0 0 25px #00eaff;
}

.status{
  margin-top:45px;
  width:100%;
  max-width:600px;
  min-height:90px;
  padding:18px;
  border:1px solid rgba(0,234,255,.35);
  border-radius:14px;
  background:rgba(0,30,45,.35);
  box-shadow:0 0 20px rgba(0,234,255,.12);
  text-align:center;
  font-size:17px;
  line-height:1.5;
  white-space:pre-line;
}

.listening{
  color:white;
  text-shadow:0 0 10px #00eaff;
}

@keyframes pulse{
  0%,100%{
    transform:scale(1);
  }
  50%{
    transform:scale(1.05);
  }
}

@media(max-width:500px){
  h1{
    font-size:38px;
    letter-spacing:8px;
  }

  .core{
    width:160px;
    height:160px;
  }

  .status{
    font-size:15px;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>JARVIS</h1>

<div class="core"></div>

<div id="status" class="status">
Initializing JARVIS...
</div>

</div>

<script>

/* =====================================
   JARVIS V6
   FULL CONVERSATION MODE
===================================== */

const statusBox = document.getElementById("status");

let voices = [];
let recognition = null;
let isSpeaking = false;
let shouldListen = true;
let restartTimer = null;


/* =====================================
   VOICES
===================================== */

function loadVoices(){
  voices = speechSynthesis.getVoices();
}

loadVoices();

if("speechSynthesis" in window){
  speechSynthesis.onvoiceschanged = loadVoices;
}


/* =====================================
   SPEAK
===================================== */

function speak(text, afterSpeak=true){

  if(!("speechSynthesis" in window)){
    statusBox.innerText = "JARVIS:\n" + text;
    return;
  }

  isSpeaking = true;

  speechSynthesis.cancel();

  const msg = new SpeechSynthesisUtterance(text);

  msg.lang = "en-IN";
  msg.rate = 0.90;
  msg.pitch = 0.72;
  msg.volume = 1;

  const preferred =
    voices.find(v => /Google UK English Male/i.test(v.name)) ||
    voices.find(v => /Microsoft David/i.test(v.name)) ||
    voices.find(v => /Microsoft Mark/i.test(v.name)) ||
    voices.find(v => /Daniel/i.test(v.name)) ||
    voices.find(v => /English/i.test(v.name));

  if(preferred){
    msg.voice = preferred;
  }

  msg.onend = function(){

    isSpeaking = false;

    if(afterSpeak){
      waitAndListen();
    }
  };

  msg.onerror = function(){

    isSpeaking = false;

    if(afterSpeak){
      waitAndListen();
    }
  };

  speechSynthesis.speak(msg);
}


/* =====================================
   NORMALIZE TEXT
===================================== */

function clean(text){

  return text
    .toLowerCase()
    .replace(/[?!.,'"]/g," ")
    .replace(/\s+/g," ")
    .trim();
}


/* =====================================
   CURRENT TIME
===================================== */

function getTimeAnswer(){

  const now = new Date();

  return "Sir, abhi time hai " +
    now.toLocaleTimeString("en-IN",{
      hour:"numeric",
      minute:"2-digit",
      second:"2-digit"
    });
}


/* =====================================
   EMOTIONAL RESPONSES
===================================== */

function emotionalAnswer(q){

  if(
    q.includes("i am sad") ||
    q.includes("i feel sad") ||
    q.includes("i am feeling sad") ||
    q.includes("main sad") ||
    q.includes("mood off")
  ){
    return "I'm sorry sir. Aaj agar mood low hai to thoda break lijiye, paani piye aur khud par zyada pressure mat daliye. Main yahin hoon.";
  }

  if(
    q.includes("i am stressed") ||
    q.includes("i feel stressed") ||
    q.includes("i am under stress") ||
    q.includes("main stressed") ||
    q.includes("bahut stress")
  ){
    return "Sir, stress ke time sab kuch ek saath solve karne ki zarurat nahi hai. Ek chhota task choose kijiye aur bas usse complete kijiye. Step by step.";
  }

  if(
    q.includes("i am tired") ||
    q.includes("i feel tired") ||
    q.includes("main tired") ||
    q.includes("thak gaya")
  ){
    return "Sir, agar aap genuinely tired hain to rest lena weakness nahi hai. Thoda paani piye, relax kijiye aur zarurat ho to proper sleep lijiye.";
  }

  if(
    q.includes("i am nervous") ||
    q.includes("i feel nervous") ||
    q.includes("main nervous")
  ){
    return "Sir, nervous hona normal hai. Dheere saans lijiye, situation ko ek step at a time handle kijiye. Aapko sab kuch ek hi moment mein perfect nahi karna.";
  }

  if(
    q.includes("i failed") ||
    q.includes("i got bad marks") ||
    q.includes("marks are bad") ||
    q.includes("main fail")
  ){
    return "Sir, ek result aapki capability decide nahi karta. Mistakes identify kijiye, unhe samjhiye aur next attempt ke liye improve kijiye.";
  }

  if(
    q.includes("i don't feel like studying") ||
    q.includes("i dont feel like studying") ||
    q.includes("padhne ka mann nahi")
  ){
    return "Sir, motivation ka wait mat kijiye. Bas 10 minutes ke liye book kholiye aur ek easy question start kijiye. Start karna hi sabse important step hai.";
  }

  if(
    q.includes("i am happy") ||
    q.includes("i feel happy") ||
    q.includes("main khush")
  ){
    return "That's great, sir. Enjoy the moment. Aise positive moments ko remember karna bhi important hai.";
  }

  if(
    q.includes("i am bored") ||
    q.includes("i feel bored") ||
    q.includes("main bore")
  ){
    return "Sir, boredom aa raha hai to activity change kijiye. Thoda walk, music, hobby ya koi small productive task try kar sakte hain.";
  }

  if(
    q.includes("motivate me") ||
    q.includes("motivation") ||
    q.includes("mujhe motivate")
  ){
    return "Sir, progress hamesha dramatic nahi hoti. Kabhi kabhi bas kal se thoda better hona hi progress hai. Keep going.";
  }

  if(
    q.includes("are you with me") ||
    q.includes("will you help me") ||
    q.includes("tum mere saath")
  ){
    return "Of course sir. Jab bhi aap mujhse baat karenge, main jitna possible ho sake utni help karunga.";
  }

  return null;
}

/* =====================================
   ANSWER ENGINE
===================================== */

function findAnswer(question){

  const q = clean(question);

  /* TIME */

  if(
    q.includes("what time") ||
    q.includes("current time") ||
    q.includes("time kya") ||
    q.includes("kitne baje") ||
    q === "time" ||
    q.includes("tell me the time")
  ){
    return getTimeAnswer();
  }


  /* GREETINGS */

  if(
    q.includes("hello") ||
    q.includes("hi jarvis") ||
    q.includes("hey jarvis") ||
    q.includes("namaste")
  ){
    return "Hello sir. Main aapki kya madad kar sakta hoon?";
  }


  /* IDENTITY */

  if(
    q.includes("who are you") ||
    q.includes("tum kaun ho") ||
    q.includes("aap kaun ho")
  ){
    return "I am JARVIS, your personal AI assistant.";
  }


  /* THANKS */

  if(
    q.includes("thank you") ||
    q.includes("thanks") ||
    q.includes("thank u") ||
    q.includes("dhanyavad")
  ){
    return "You're welcome sir.";
  }


  /* EMOTIONAL */

  const emotional = emotionalAnswer(q);

  if(emotional){
    return emotional;
  }


  /* GENERAL FACTS */

  if(
    q.includes("capital of india") ||
    q.includes("india ki capital")
  ){
    return "The capital of India is New Delhi.";
  }

  if(q.includes("largest planet")){
    return "Jupiter is the largest planet in our Solar System.";
  }

  if(q.includes("smallest planet")){
    return "Mercury is the smallest planet in our Solar System.";
  }

  if(q.includes("largest ocean")){
    return "The Pacific Ocean is the largest ocean on Earth.";
  }

  if(
    q.includes("formula of water") ||
    q.includes("chemical formula of water")
  ){
    return "The chemical formula of water is H2O.";
  }

  if(q.includes("speed of light")){
    return "The speed of light in vacuum is approximately 3 times 10 to the power 8 metres per second.";
  }

  if(q.includes("value of pi")){
    return "Pi is approximately 3.14159.";
  }


  /* KNOWLEDGE */

  for(const item of knowledge){

    for(const key of item.keys){

      if(q.includes(clean(key))){
        return item.answer;
      }

    }

  }


  /* FALLBACK */

  return "Sorry sir, mujhe iska exact answer abhi nahi pata. Aap question ko thoda different words mein pooch sakte hain.";

}


/* =====================================
   SPEECH RECOGNITION
===================================== */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

if(SpeechRecognition){

  recognition = new SpeechRecognition();

  recognition.lang = "en-IN";
  recognition.continuous = false;
  recognition.interimResults = false;


  recognition.onstart = function(){

    statusBox.classList.add("listening");

    statusBox.innerText =
      "Listening...\nBoliye sir.";

  };


  recognition.onresult = function(event){

    const question =
      event.results[0][0].transcript;

    const answer =
      findAnswer(question);

    statusBox.innerText =
      "You: " + question +
      "\n\nJARVIS: " + answer;

    speak(answer,true);

  };


  recognition.onerror = function(event){

    statusBox.classList.remove("listening");

    /*
      If microphone permission/problem occurs,
      retry automatically.
    */

    waitAndListen();

  };


  recognition.onend = function(){

    statusBox.classList.remove("listening");

    /*
      Recognition naturally stops after one sentence.
      So we start it again.
    */

    if(!isSpeaking && shouldListen){

      waitAndListen();

    }

  };

}else{

  statusBox.innerText =
    "Sir, this browser does not support voice recognition.";

}


/* =====================================
   RESTART LISTENING
===================================== */

function waitAndListen(){

  clearTimeout(restartTimer);

  restartTimer = setTimeout(function(){

    if(
      recognition &&
      !isSpeaking &&
      shouldListen
    ){

      try{
        recognition.start();
      }catch(e){

        /*
          Browser may say recognition is already running.
          Try again shortly.
        */

        setTimeout(function(){

          try{
            recognition.start();
          }catch(e2){}

        },1000);

      }

    }

  },1000);

}


/* =====================================
   START JARVIS
===================================== */

function startJarvis(){

  const greeting =
    "Hello sir. Main aapki kya madad kar sakta hoon?";

  statusBox.innerText =
    "JARVIS:\n" + greeting;

  /*
    First greeting.
    After speaking, conversation mode starts.
  */

  setTimeout(function(){

    speak(greeting,true);

  },800);

}


/* =====================================
   PAGE LOAD
===================================== */

window.addEventListener(
  "load",
  startJarvis
);

</script>
