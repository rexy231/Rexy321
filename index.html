<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050811"><title>JARVIS — Avatar Test</title>
<style>
:root{color-scheme:dark;--cyan:#75e8ff;--panel:#061427d9}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030711;color:#eafaff;font-family:Arial,system-ui,sans-serif}body{background:radial-gradient(ellipse at 50% 38%,#102b4c 0,#061121 48%,#02050b 100%)}
main{position:relative;width:100%;height:100dvh;overflow:hidden;isolation:isolate}.brand{position:absolute;z-index:5;top:18px;left:20px;letter-spacing:.3em;color:var(--cyan);font-size:13px;text-shadow:0 0 18px #45caff}.sub{display:block;letter-spacing:.08em;font-size:10px;margin-top:5px;color:#b3d9f4}.orb{position:absolute;width:min(95vw,620px);aspect-ratio:1;border:1px solid #69dfff33;border-radius:50%;left:50%;top:45%;transform:translate(-50%,-50%);box-shadow:0 0 80px #168cff12,inset 0 0 80px #168cff10}.orb:before,.orb:after{content:"";position:absolute;inset:8%;border:1px solid #69dfff25;border-radius:50%;transform:rotateX(65deg)}.orb:after{inset:19%;transform:rotateY(60deg)}
.avatar-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}.avatar{position:absolute;height:min(88dvh,920px);width:auto;max-width:100vw;object-fit:contain;bottom:-3%;filter:drop-shadow(0 0 26px #318dff24);transform-origin:50% 78%;animation:idle 4.5s ease-in-out infinite}.avatar.talking{animation:talkbody .42s ease-in-out infinite alternate}.mouth{position:absolute;left:50%;top:39.5%;width:clamp(15px,2.5vw,26px);height:7px;transform:translateX(-50%);border-radius:50%;background:#541b2b;opacity:0;box-shadow:inset 0 1px 2px #16070d;z-index:2}.avatar-wrap.talking .mouth{opacity:.88;animation:mouth .13s infinite alternate}.mouth:after{content:"";position:absolute;left:15%;right:15%;bottom:1px;height:2px;background:#ffb4bd;border-radius:50%}
@keyframes idle{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(.25deg)}}@keyframes talkbody{from{transform:translateY(0) rotate(-.25deg)}to{transform:translateY(-3px) rotate(.25deg)}}@keyframes mouth{from{height:3px;transform:translateX(-50%) scaleX(.8)}to{height:12px;transform:translateX(-50%) scaleX(1.08)}}
.bottom{position:absolute;z-index:5;left:18px;right:18px;bottom:max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:12px}.status{font-size:11px;letter-spacing:.2em;color:var(--cyan);text-shadow:0 1px 8px #000}.message{width:min(92vw,560px);text-align:center;line-height:1.5;font-size:clamp(14px,3.8vw,18px);text-shadow:0 1px 8px #000;min-height:48px}.mic{border:1px solid #66dfff;border-radius:50%;width:58px;height:58px;background:#041326d9;color:#8eeeff;font-size:24px;box-shadow:0 0 22px #00bfff33;cursor:pointer}.mic:active{transform:scale(.96)}.hint{font-size:10px;color:#9cb9cc;text-align:center;max-width:90vw}.weather{position:absolute;top:18px;right:16px;border:1px solid #56cfff55;background:#041326b8;border-radius:12px;padding:10px 12px;font-size:11px;color:#c8e9ff;max-width:42vw;z-index:5}.weather strong{display:block;font-size:16px;color:white;margin-bottom:4px}@media(max-width:520px){.brand{top:14px;left:14px}.weather{top:58px;right:12px}.avatar{height:min(79dvh,760px);bottom:7%}.bottom{bottom:max(12px,env(safe-area-inset-bottom))}.orb{top:43%}}
</style></head><body><main>
<div class="brand">J.A.R.V.I.S.<span class="sub">VOICE AVATAR · TEST BUILD</span></div><div class="orb"></div><div class="weather" id="weather"><strong>WEATHER</strong>Say “weather” to check locally</div>
<div class="avatar-wrap" id="avatarWrap"><img class="avatar" id="avatar" src="jarvis_avatar.png" alt="JARVIS anime avatar"><span class="mouth" aria-hidden="true"></span></div>
<div class="bottom"><div class="status" id="status">READY</div><div class="message" id="message" aria-live="polite">Hi! I'm JARVIS. Tap the microphone once to start voice mode.</div><button class="mic" id="mic" aria-label="Start voice listening">🎙</button><div class="hint">Prototype: mouth/body motion is visual approximation, not a fully rigged Live2D model.</div></div>
</main><script>
(()=>{'use strict';const status=document.querySelector('#status'),message=document.querySelector('#message'),wrap=document.querySelector('#avatarWrap'),mic=document.querySelector('#mic'),weatherBox=document.querySelector('#weather');const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const synth=window.speechSynthesis;let rec=null,listening=false,speaking=false,restart=false;
function setStatus(s){status.textContent=s}function speak(text){message.textContent=text;if(!synth){setStatus('SPEECH OUTPUT UNAVAILABLE');return}synth.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-IN';u.rate=.96;u.pitch=1.08;const vs=synth.getVoices();const v=vs.find(x=>/en-IN|hi-IN/i.test(x.lang))||vs.find(x=>/female|samantha|google/i.test(x.name));if(v)u.voice=v;u.onstart=()=>{speaking=true;wrap.classList.add('talking');setStatus('JARVIS SPEAKING')};u.onend=()=>{speaking=false;wrap.classList.remove('talking');setStatus('READY');if(listening)startListen()};u.onerror=()=>{speaking=false;wrap.classList.remove('talking');setStatus('READY')};synth.speak(u)}
async function weather(){setStatus('CHECKING WEATHER');if(!navigator.geolocation){speak('Location is not available in this browser.');return}navigator.geolocation.getCurrentPosition(async p=>{try{const q=p.coords;const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${q.latitude}&longitude=${q.longitude}&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto`);if(!r.ok)throw 0;const d=await r.json(),c=d.current,day=d.daily,codes={0:'clear sky',1:'mainly clear',2:'partly cloudy',3:'overcast',45:'foggy',48:'foggy',51:'light drizzle',53:'drizzle',55:'heavy drizzle',61:'light rain',63:'rain',65:'heavy rain',80:'rain showers',81:'rain showers',82:'heavy rain showers',95:'a thunderstorm',96:'a thunderstorm with hail',99:'a strong thunderstorm'};weatherBox.innerHTML=`<strong>${Math.round(c.temperature_2m)}°C · ${codes[c.weather_code]||'changing'}</strong>Feels ${Math.round(c.apparent_temperature)}° · Humidity ${Math.round(c.relative_humidity_2m)}%`;speak(`Here is your weather. It is ${codes[c.weather_code]||'changing'} and ${Math.round(c.temperature_2m)} degrees Celsius. It feels like ${Math.round(c.apparent_temperature)} degrees. Humidity is ${Math.round(c.relative_humidity_2m)} percent. Wind speed is ${Math.round(c.wind_speed_10m)} kilometres per hour. Today's high is ${Math.round(day.temperature_2m_max[0])} degrees and low is ${Math.round(day.temperature_2m_min[0])}. Chance of precipitation is ${day.precipitation_probability_max[0]} percent.`)}catch(e){speak('Sorry, I could not fetch the weather. Check your internet and try again.')}},()=>speak('Please allow location access to get your local weather.'),{timeout:10000,maximumAge:300000})}
function respond(input){const t=input.toLowerCase();if(/weather|temperature|forecast|rain today|how hot/.test(t))return weather();if(/\b(hi|hello|hey|good morning|good afternoon|good evening)\b/.test(t))return speak('Hey! I am here and listening. What would you like to talk about?');if(/\b(time|what time)\b/.test(t))return speak('It is '+new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(new Date())+'.');if(/\b(date|what day|today's date|todays date)\b/.test(t))return speak('Today is '+new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric'}).format(new Date())+'.');if(/\b(sad|upset|lonely|stressed|bad day|feel low|feeling low)\b/.test(t))return speak('I am sorry things feel hard right now. I am listening. Want to tell me what happened?');if(/\b(happy|excited|great news|i did it|i passed|completed)\b/.test(t))return speak('That sounds exciting! I am glad you shared it with me.');if(/\b(thank you|thanks)\b/.test(t))return speak('You are welcome! I am ready to help.');if(/\b(who are you|your name)\b/.test(t))return speak('I am JARVIS, your voice-first assistant prototype.');if(/\b(stop speaking|be quiet|cancel speech)\b/.test(t)){synth.cancel();speaking=false;wrap.classList.remove('talking');setStatus('READY');return}return speak('I heard you. This prototype has basic commands only; a full conversational AI connection is still needed for open-ended replies.')}
function startListen(){if(!SR){setStatus('VOICE RECOGNITION NOT SUPPORTED');message.textContent='Open this page in Chrome on an HTTPS site and check browser support.';return}if(speaking||restart)return;try{rec=new SR();rec.lang='en-IN';rec.continuous=false;rec.interimResults=false;rec.onstart=()=>{restart=false;setStatus('LISTENING');message.textContent='I am listening…'};rec.onresult=e=>{const t=e.results[e.results.length-1][0].transcript;message.textContent=t;respond(t)};rec.onerror=e=>{restart=false;setStatus(e.error==='not-allowed'?'MICROPHONE PERMISSION NEEDED':'VOICE INPUT ISSUE');if(e.error==='not-allowed')message.textContent='Allow microphone permission in your browser, then tap the microphone again.'};rec.onend=()=>{restart=false;if(listening&&!speaking)setTimeout(startListen,700)};restart=true;rec.start()}catch(e){restart=false;setStatus('TAP MIC TO RETRY')}}
mic.addEventListener('click',()=>{listening=true;startListen()});if(synth)synth.getVoices();})();
</script></body></html>
