<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #050b14;
      color: #00eaff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .jarvis {
      width: 92%;
      max-width: 600px;
      text-align: center;
      border: 1px solid #00eaff;
      border-radius: 25px;
      padding: 30px 20px;
      box-shadow: 0 0 30px #006dff;
    }

    .core {
      width: 130px;
      height: 130px;
      margin: 20px auto;
      border: 5px solid #00eaff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 0 35px #00eaff;
    }

    h1 {
      letter-spacing: 8px;
      margin-bottom: 5px;
    }

    #status {
      color: #8ff6ff;
      margin-bottom: 25px;
    }

    button {
      background: transparent;
      color: #00eaff;
      border: 1px solid #00eaff;
      border-radius: 12px;
      padding: 13px 22px;
      margin: 7px;
      font-size: 15px;
    }

    button:active {
      background: #00eaff;
      color: #001018;
    }

    #output {
      margin-top: 25px;
      min-height: 60px;
      border: 1px solid #174b63;
      border-radius: 12px;
      padding: 15px;
      color: white;
    }
  </style>
</head>

<body>

  <div class="jarvis">

    <h1>J.A.R.V.I.S</h1>
    <div id="status">SYSTEM ONLINE</div>

    <div class="core">J</div>

    <button onclick="speak('Hello. I am JARVIS.')">
      🔊 TEST VOICE
    </button>

    <button onclick="tellTime()">
      🕐 TIME
    </button>

    <button onclick="studyMode()">
      📚 STUDY MODE
    </button>

    <div id="output">
      Awaiting command...
    </div>

  </div>

  <script>
    function speak(text) {
      document.getElementById("output").innerText = text;

      const voice = new SpeechSynthesisUtterance(text);
      voice.rate = 0.95;
      voice.pitch = 0.8;

      speechSynthesis.speak(voice);
    }

    function tellTime() {
      const time = new Date().toLocaleTimeString();
      speak("The current time is " + time);
    }

    function studyMode() {
      speak("Study mode activated. Let's begin.");
    }
  </script>

</body>
</html>
