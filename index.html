<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#02070d;
  color:#00eaff;
  font-family:Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

.container{
  width:100%;
  max-width:700px;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:25px;
}

h1{
  font-size:48px;
  letter-spacing:12px;
  margin:0 0 45px;
  text-shadow:
    0 0 10px #00eaff,
    0 0 25px #00eaff,
    0 0 50px #007bff;
}

.core{
  width:190px;
  height:190px;
  border-radius:50%;
  border:3px solid #00eaff;
  box-shadow:
    0 0 15px #00eaff,
    0 0 40px #00eaff,
    inset 0 0 30px #006eff;
  display:flex;
  justify-content:center;
  align-items:center;
  animation:pulse 2s infinite;
  position:relative;
}

.core::before{
  content:"";
  width:80px;
  height:80px;
  border-radius:50%;
  border:2px solid #00eaff;
  box-shadow:0 0 25px #00eaff;
}

.core::after{
  content:"";
  position:absolute;
  width:18px;
  height:18px;
  border-radius:50%;
  background:#ffffff;
  box-shadow:
    0 0 10px #00eaff,
    0 0 25px #00eaff;
}

.status{
  margin-top:45px;
  width:100%;
  max-width:600px;
  min-height:80px;
  padding:18px;
  border:1px solid rgba(0,234,255,.35);
  border-radius:14px;
  background:rgba(0,30,45,.35);
  box-shadow:0 0 20px rgba(0,234,255,.12);
  text-align:center;
  font-size:17px;
  line-height:1.5;
}

.listening{
  color:#ffffff;
  text-shadow:0 0 10px #00eaff;
}

@keyframes pulse{
  0%,100%{
    transform:scale(1);
    box-shadow:
      0 0 15px #00eaff,
      0 0 40px #00eaff,
      inset 0 0 30px #006eff;
  }
  50%{
    transform:scale(1.05);
    box-shadow:
      0 0 25px #00eaff,
      0 0 70px #007bff,
      inset 0 0 45px #006eff;
  }
}

@media(max-width:500px){
  h1{
    font-size:38px;
    letter-spacing:8px;
  }

  .core{
    width:160px;
    height:160px;
  }

  .status{
    font-size:15px;
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>JARVIS</h1>

  <div class="core"></div>

  <div id="status" class="status">

/* =========================
   JARVIS VOICE
========================= */

const statusBox = document.getElementById("status");

let voices = [];

function loadVoices(){
  voices = speechSynthesis.getVoices();
}

loadVoices();

if("speechSynthesis" in window){
  speechSynthesis.onvoiceschanged = loadVoices;
}

function speak(text){

  if(!("speechSynthesis" in window)){
    statusBox.innerText = text;
    return;
  }

  speechSynthesis.cancel();

  const msg = new SpeechSynthesisUtterance(text);

  msg.lang = "en-IN";
  msg.rate = 0.92;
  msg.pitch = 0.75;
  msg.volume = 1;

  const preferred =
    voices.find(v => /Google UK English Male/i.test(v.name)) ||
    voices.find(v => /Microsoft David/i.test(v.name)) ||
    voices.find(v => /Microsoft Mark/i.test(v.name)) ||
    voices.find(v => /Daniel/i.test(v.name)) ||
    voices.find(v => /English/i.test(v.name));

  if(preferred){
    msg.voice = preferred;
  }

  speechSynthesis.speak(msg);
}

/* =========================
   QUESTION ANSWER ENGINE
========================= */

function cleanText(text){

  return text
    .toLowerCase()
    .replace(/[?!.,]/g," ")
    .replace(/\s+/g," ")
    .trim();

}

function findAnswer(question){

  const q = cleanText(question);

  /* greetings */

  if(
    q.includes("hello") ||
    q.includes("hi jarvis") ||
    q.includes("hey jarvis") ||
    q.includes("namaste")
  ){
    return "Hello sir. Main JARVIS hoon. Main aapki kya madad kar sakta hoon?";
  }

  /* identity */

  if(
    q.includes("who are you") ||
    q.includes("tum kaun ho") ||
    q.includes("aap kaun ho")
  ){
    return "I am JARVIS, your personal AI assistant.";
  }

  /* thanks */

  if(
    q.includes("thank you") ||
    q.includes("thanks") ||
    q.includes("dhanyavad")
  ){
    return "You're welcome sir.";
  }

  /* knowledge search */

  for(const item of knowledge){

    for(const key of item.keys){

      if(q.includes(cleanText(key))){
        return item.answer;
      }

    }

  }

  /* common general questions */

  if(q.includes("capital of india") || q.includes("india ki capital")){
    return "The capital of India is New Delhi.";
  }

  if(q.includes("largest planet")){
    return "Jupiter is the largest planet in our Solar System.";
  }

  if(q.includes("smallest planet")){
    return "Mercury is the smallest planet in our Solar System.";
  }

  if(q.includes("fastest animal")){
    return "The peregrine falcon is generally considered the fastest animal during its diving flight.";
  }

  if(q.includes("largest ocean")){
    return "The Pacific Ocean is the largest ocean on Earth.";
  }

  if(q.includes("chemical formula of water") || q.includes("formula of water")){
    return "The chemical formula of water is H2O.";
  }

  if(q.includes("speed of light")){
    return "The speed of light in vacuum is approximately 3 times 10 to the power 8 metres per second.";
  }

  if(q.includes("value of pi")){
    return "Pi is approximately 3.14159.";
  }

  if(q.includes("gravity on earth")){
    return "The acceleration due to gravity near Earth's surface is approximately 9.8 metres per second squared.";
  }

  /* fallback */

  return "Sorry sir, mujhe is question ka exact answer meri current knowledge mein nahi mila. Aap question ko thoda different words mein pooch sakte hain.";

}


/* =========================
   VOICE RECOGNITION
========================= */

let recognition = null;

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

if(SpeechRecognition){

  recognition = new SpeechRecognition();

  recognition.lang = "en-IN";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = function(){

    statusBox.classList.add("listening");
    statusBox.innerText = "Listening...";
  };

  recognition.onresult = function(event){

    const question =
      event.results[0][0].transcript;

    const answer = findAnswer(question);

    statusBox.innerText =
      "You: " + question +
      "\n\nJARVIS: " + answer;

    speak(answer);
  };

  recognition.onerror = function(){

    statusBox.classList.remove("listening");

    statusBox.innerText =
      "Voice command could not be heard. Please try again.";
  };

  recognition.onend = function(){

    statusBox.classList.remove("listening");
  };

}


/* =========================
   START JARVIS
========================= */

function startJarvis(){

  const greeting =
    "Hello sir. Main aapki kya madad kar sakta hoon?";

  statusBox.innerText = greeting;

  /* speak after a small delay */
  setTimeout(function(){

    speak(greeting);

    /*
      Start listening after greeting.
      Some mobile browsers may block microphone
      until the user gives permission.
    */

    setTimeout(function(){

      if(recognition){

        try{
          recognition.start();
        }catch(e){}

      }

    },2500);

  },700);

}


/* =========================
   START
========================= */

window.addEventListener("load", startJarvis);
