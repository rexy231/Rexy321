<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050811">
<title>JARVIS</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050811;color:#eef8ff;font-family:Arial,system-ui,sans-serif}
body{background:radial-gradient(ellipse at center,#142640 0,#07101d 48%,#03060d 100%)}
main{height:100dvh;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;padding:18px}
main:before{content:"";position:absolute;inset:0;background:linear-gradient(#18314a30 1px,transparent 1px),linear-gradient(90deg,#18314a30 1px,transparent 1px);background-size:42px 42px;mask-image:radial-gradient(ellipse,#000,transparent 76%);pointer-events:none}
.brand{position:absolute;top:24px;z-index:2;letter-spacing:.38em;font-size:12px;color:#8eeaff;text-shadow:0 0 16px #53d9ff77}
.frame{position:relative;width:min(90vw,390px);height:min(66dvh,680px);border-radius:48% 48% 32px 32px;overflow:hidden;border:1px solid #8ae9ff66;box-shadow:0 0 38px #3faeff2b,0 0 90px #3faeff12;z-index:1;background:#081321}
.frame:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#07101b0a 55%,#06101ee0 100%),linear-gradient(90deg,#5bdfff12,transparent 25%,transparent 75%,#5bdfff12)}
video{width:100%;height:100%;object-fit:cover;display:block}
.orbit{position:absolute;width:min(98vw,430px);aspect-ratio:1;border:1px solid #73ddff2c;border-radius:50%;pointer-events:none;animation:spin 35s linear infinite}
.orbit:before,.orbit:after{content:"";position:absolute;inset:8%;border:1px solid #73ddff25;border-radius:50%;transform:rotateX(65deg)}
.orbit:after{inset:17%;transform:rotateY(65deg)}
.status{position:relative;z-index:2;margin-top:23px;min-height:16px;font-size:11px;letter-spacing:.22em;color:#83eaff;text-align:center}
.message{position:relative;z-index:2;margin-top:12px;width:min(92vw,560px);min-height:52px;text-align:center;line-height:1.5;font-size:clamp(15px,4vw,19px);text-wrap:balance}
@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.orbit{animation:none}}
</style>
</head>
<body>
<main>
  <div class="brand">J.A.R.V.I.S.</div>
  <div class="orbit"></div>
  <div class="frame">
    <video id="avatarVideo" autoplay muted loop playsinline preload="auto">
      <source src="1000004826.mp4" type="video/mp4">
    </video>
  </div>
  <div class="status" id="status">STARTING JARVIS</div>
  <div class="message" id="message" aria-live="polite">Please allow microphone access when your browser asks.</div>
</main>
<script>
(() => {
  "use strict";
  const statusEl=document.getElementById("status");
  const messageEl=document.getElementById("message");
  const video=document.getElementById("avatarVideo");
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const synth=window.speechSynthesis;
  let recognition=null, restarting=false, speaking=false, retryTimer=null;
  const setStatus=s=>statusEl.textContent=s;
  function say(text){
    messageEl.textContent=text;
    if(!synth){setStatus("VOICE OUTPUT UNAVAILABLE");return;}
    synth.cancel();
    const u=new SpeechSynthesisUtterance(text);
    // Browser/system voice is used here; it cannot guarantee the exact voice from the reference video.
    const voices=synth.getVoices();
    const v=voices.find(x=>/en-IN|hi-IN/i.test(x.lang)&&/female|google|heera|priya|zira/i.test(x.name))
      ||voices.find(x=>/en-IN|hi-IN/i.test(x.lang))||voices.find(x=>/female|samantha|google/i.test(x.name))||voices[0];
    if(v)u.voice=v;
    u.rate=.96;u.pitch=1.08;u.volume=1;
    u.onstart=()=>{speaking=true;setStatus("SPEAKING");};
    u.onend=()=>{speaking=false;setStatus("LISTENING");startRecognition();};
    u.onerror=()=>{speaking=false;setStatus("LISTENING");startRecognition();};
    synth.speak(u);
  }
  function weather(){
    setStatus("CHECKING WEATHER");
    if(!navigator.geolocation){say("I can't access location in this browser, so I can't check your local weather.");return;}
    navigator.geolocation.getCurrentPosition(async pos=>{
      try{
        const {latitude,longitude}=pos.coords;
        const url=`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto`;
        const r=await fetch(url);if(!r.ok)throw new Error("weather");
        const d=await r.json(),c=d.current,day=d.daily;
        const codes={0:"clear sky",1:"mainly clear",2:"partly cloudy",3:"overcast",45:"foggy",48:"foggy",51:"light drizzle",53:"drizzle",55:"heavy drizzle",61:"light rain",63:"rain",65:"heavy rain",71:"light snow",73:"snow",75:"heavy snow",80:"rain showers",81:"rain showers",82:"heavy rain showers",95:"a thunderstorm",96:"a thunderstorm with hail",99:"a strong thunderstorm"};
        say(`Here is your weather. It is ${codes[c.weather_code]||"changing"} and ${Math.round(c.temperature_2m)} degrees Celsius. It feels like ${Math.round(c.apparent_temperature)} degrees. Humidity is ${Math.round(c.relative_humidity_2m)} percent. Wind speed is ${Math.round(c.wind_speed_10m)} kilometres per hour. Today's high is ${Math.round(day.temperature_2m_max[0])} degrees and low is ${Math.round(day.temperature_2m_min[0])}. The chance of precipitation is ${day.precipitation_probability_max[0]} percent.`);
      }catch(e){say("Sorry, I couldn't fetch the weather right now. Please check your internet connection.");}
    },()=>say("Please allow location access so I can tell you your local weather."),{timeout:10000,maximumAge:300000});
  }
  function respond(input){
    const t=input.toLowerCase().trim();
    if(!t)return;
    if(/\b(weather|temperature|forecast|rain today|how hot)\b/.test(t)){weather();return;}
    if(/\b(hello|hi|hey|good morning|good afternoon|good evening)\b/.test(t)){
      const h=new Date().getHours();say(`${h<12?"Good morning":h<17?"Good afternoon":"Good evening"}. I'm here and listening. What would you like to talk about?`);return;
    }
    if(/\b(time|what time)\b/.test(t)){say(`It is ${new Intl.DateTimeFormat(undefined,{hour:"numeric",minute:"2-digit"}).format(new Date())}.`);return;}
    if(/\b(date|what day|today's date|todays date)\b/.test(t)){say(`Today is ${new Intl.DateTimeFormat(undefined,{weekday:"long",month:"long",day:"numeric"}).format(new Date())}.`);return;}
    if(/\b(sad|upset|lonely|stressed|bad day|feel low|feeling low)\b/.test(t)){say("I'm sorry you're feeling this way. You don't have to handle everything at once. I'm listening; tell me what happened if you'd like.");return;}
    if(/\b(happy|excited|great news|i did it|i passed|completed)\b/.test(t)){say("That's wonderful news! I'm glad you told me. Take a moment to enjoy what you've achieved.");return;}
    if(/\b(thank you|thanks)\b/.test(t)){say("You're welcome. I'm always ready to help.");return;}
    if(/\b(who are you|your name)\b/.test(t)){say("I'm JARVIS, your voice-first assistant. I can listen for your commands, answer a few everyday requests, and read your local weather.");return;}
    if(/\b(stop speaking|be quiet|cancel speech)\b/.test(t)){synth.cancel();speaking=false;setStatus("LISTENING");startRecognition();return;}
    say("I heard you. I can help with basic voice commands right now, but I don't yet have a full language-model brain connected. Please say that another way.");
  }
  function startRecognition(){
    if(!SR){setStatus("VOICE RECOGNITION NOT SUPPORTED");messageEl.textContent="Open this page in a compatible browser such as Chrome and use a secure HTTPS website.";return;}
    if(speaking||restarting)return;
    if(recognition){try{recognition.stop()}catch(e){}}
    recognition=new SR();
    recognition.lang="en-IN";recognition.continuous=false;recognition.interimResults=false;
    recognition.onstart=()=>{restarting=false;setStatus("LISTENING");messageEl.textContent="I'm listening…";};
    recognition.onresult=e=>{const spoken=e.results[e.results.length-1][0].transcript;messageEl.textContent=spoken;try{recognition.stop()}catch(e){}respond(spoken);};
    recognition.onerror=e=>{
      restarting=false;
      if(e.error==="not-allowed"||e.error==="service-not-allowed"){setStatus("MICROPHONE PERMISSION NEEDED");messageEl.textContent="Allow microphone access in your browser settings, then reload this page.";return;}
      if(e.error==="audio-capture"){setStatus("MICROPHONE NOT FOUND");return;}
      scheduleRestart();
    };
    recognition.onend=()=>{restarting=false;if(!speaking)scheduleRestart();};
    try{restarting=true;recognition.start()}catch(e){restarting=false;scheduleRestart();}
  }
  function scheduleRestart(){clearTimeout(retryTimer);retryTimer=setTimeout(()=>{if(!speaking)startRecognition()},800);}
  video.play().catch(()=>{messageEl.textContent="Tap the page once to start the avatar video, then allow microphone access."});
  if(synth)synth.getVoices();
  // The page attempts to start listening automatically. Browsers may require permission/user interaction.
  window.addEventListener("load",()=>setTimeout(startRecognition,900));
})();
</script>
</body>
</html>
